# =============================================================================
# .github/workflows/ci.yml
# Continuous Integration — runs on every push and pull request to main.
# Checks: dependency install → NLTK setup → core pipeline unit tests
# =============================================================================

name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # ── 1. Checkout code ───────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ───────────────────────────────────────────────────
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # ── 3. Install dependencies ────────────────────────────────────────────
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── 4. Download NLTK corpora ───────────────────────────────────────────
      - name: Download NLTK data
        run: python setup.py

      # ── 5. Run tests ───────────────────────────────────────────────────────
      - name: Run pipeline tests
        run: python -m pytest tests/ -v --tb=short
        # Falls back gracefully if tests/ folder doesn't exist yet
        continue-on-error: true

      # ── 6. Smoke-test the NLP pipeline ────────────────────────────────────
      - name: Smoke test — full pipeline
        run: |
          python - <<'EOF'
          import sys, os
          sys.path.insert(0, ".")
          import pandas as pd
          from src.preprocessor       import preprocess_dataframe
          from src.sentiment_analyzer import analyze_dataframe, get_sentiment_summary
          from src.keyword_extractor  import extract_keywords_tfidf
          from src.trend_analyzer     import monthly_sentiment_trend

          df = pd.read_csv("dataset/sample_feedback.csv")
          df = preprocess_dataframe(df, "review_text")
          df = analyze_dataframe(df, "review_text")

          summary = get_sentiment_summary(df)
          assert summary["total"] > 0,                "No reviews processed"
          assert summary["positive_pct"] > 0,         "No positive reviews found"
          assert "cleaned_text" in df.columns,        "Preprocessing failed"
          assert "sentiment"    in df.columns,        "Sentiment column missing"

          kw = extract_keywords_tfidf(df["cleaned_text"].tolist(), top_n=10)
          assert len(kw) > 0, "Keyword extraction returned nothing"

          trend = monthly_sentiment_trend(df)
          assert len(trend) > 0, "Trend analysis returned nothing"

          print("✅ All smoke tests passed!")
          print(f"   Total reviews : {summary['total']}")
          print(f"   Positive      : {summary['positive_pct']}%")
          print(f"   Negative      : {summary['negative_pct']}%")
          print(f"   Keywords found: {len(kw)}")
          print(f"   Monthly rows  : {len(trend)}")
          EOF

  # ── Lint job ──────────────────────────────────────────────────────────────
  lint:
    name: Lint with flake8
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install flake8
        run: pip install flake8

      - name: Run flake8 (warnings only — non-blocking)
        run: |
          flake8 src/ database/ config/ app.py \
            --max-line-length=110 \
            --extend-ignore=E203,W503,E501 \
            --statistics || true
